---
- name: "Cwiczenie 1b: Praktyczna obsluga bledow i bezpieczny rollback"
  hosts: localhost
  connection: local
  become: true

  tasks:
    # KROK PRZYGOTOWAWCZY: Tworzymy plik, który udaje naszą obecną, działającą konfigurację
    - name: "PRZYGOTOWANIE: Stworzenie obecnego pliku konfiguracyjnego"
      ansible.builtin.copy:
        content: "Wersja_Stabilna_v1.0"
        dest: /tmp/serwer.conf

    # SEKCJA GŁÓWNA ORAZ AWARYJNA
    - name: "PROCES WDROŻENIA: Bezpieczna aktualizacja"
      block:
        - name: "1. Tworzenie kopii zapasowej (Backupu) obecnej konfiguracji"
          ansible.builtin.copy:
            src: /tmp/serwer.conf
            dest: /tmp/serwer.conf.bak
            remote_src: true

        - name: "2. Próba wdrożenia nowej konfiguracji (Celowy błąd - złe źródło pliku)"
          ansible.builtin.copy:
            src: /katalog/ktory/nie/istnieje/nowy.conf  # <-- To wywoła awarię systemu
            dest: /tmp/serwer.conf

      rescue:
        - name: "AWARYJNY ROLLBACK: Przywracanie starej konfiguracji z backupu"
          ansible.builtin.copy:
            src: /tmp/serwer.conf.bak
            dest: /tmp/serwer.conf
            remote_src: true

      always:
        - name: "SPRZĄTANIE: Bezwarunkowe usunięcie pliku kopii zapasowej"
          ansible.builtin.file:
            path: /tmp/serwer.conf.bak
            state: absent